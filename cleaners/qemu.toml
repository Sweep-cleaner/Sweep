id = "qemu"
name = "QEMU"
description = "QEMU emulator cache (disk images and VM configs are kept)"
os = "linux"

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/qemu"

[[option]]
id = "cache"
label = "Emulator cache"
description = "Delete the QEMU cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$"
os = "linux"
