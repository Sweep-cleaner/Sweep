id = "clementine"
name = "Clementine"
description = "Clementine music player: stream and cover-art cache plus logs (library is kept)"

[[running]]
type = "exe"
value = "clementine"

[[var]]
name = "config"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/Clementine"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Clementine'

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/Clementine"
[[var.value]]
os = "windows"
search = "glob"
value = '$LOCALAPPDATA\Clementine'

[[option]]
id = "cache"
label = "Cache"
description = "Delete Clementine's stream and cover-art cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$"

[[option]]
id = "logs"
label = "Logs"
description = "Delete Clementine log files"

[[option.action]]
command = "delete"
search = "glob"
path = "$$config$$/*.log*"
type = "f"
