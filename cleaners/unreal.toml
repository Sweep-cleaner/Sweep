id = "unreal"
name = "Unreal Engine"
description = "DerivedDataCache and editor logs (projects, vault and licenses are kept)"
os = "linux"

[[running]]
type = "exe"
value = "UnrealEditor"
os = "unix"

[[var]]
name = "engine"
[[var.value]]
value = "~/UnrealEngine/Engine"
search = "literal"
os = "linux"

[[option]]
id = "ddc"
label = "Derived Data Cache"
description = "Delete compiled derived data (rebuilt on next editor start, can take a while)"
warning = "Rebuilding derived data on large projects takes a long time."
os = "linux"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$engine$$/DerivedDataCache"
os = "linux"

[[option]]
id = "logs"
label = "Program logs"
description = "Delete saved program logs older than 30 days"
os = "linux"

[[option.action]]
command = "delete"
search = "glob"
path = "$$engine$$/Programs/*/Saved/Logs/*.log"
max_age_days = 30
type = "f"
os = "linux"
