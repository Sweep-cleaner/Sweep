id = "atom"
name = "Atom"
description = "Atom editor cache, logs and crash dumps (packages and config are kept)"

[[running]]
type = "exe"
value = "atom"
os = "unix"

[[running]]
type = "exe"
value = "atom.exe"
os = "windows"

[[var]]
name = "config"
[[var.value]]
os = "unix"
search = "glob"
value = "~/.config/Atom"
[[var.value]]
os = "windows"
search = "glob"
value = "$APPDATA\\Atom"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Atom"

[[option]]
id = "cache"
label = "Cache"
description = "Delete the client, GPU and code caches"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Code Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/GPUCache"

[[option]]
id = "logs"
label = "Logs"
description = "Delete log files and crash dumps"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Crashpad"
