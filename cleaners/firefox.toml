id = "firefox"
name = "Firefox"
description = "Mozilla Firefox web browser: cache, history, cookies and thumbnails"

[[running]]
type = "exe"
value = "firefox"
os = "unix"

[[running]]
type = "exe"
value = "firefox-esr"
os = "unix"

[[running]]
type = "exe"
value = "firefox-bin"
os = "unix"

[[running]]
type = "exe"
value = "firefox.exe"
os = "windows"

[[running]]
type = "exe"
value = "firefox"
os = "macos"

[[var]]
name = "profile"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.mozilla/firefox/*"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Firefox/Profiles/*"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Mozilla\Firefox\Profiles\*'

[[option]]
id = "cache"
label = "Cache"
description = "Delete the Firefox cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/cache2"

[[option.action]]
command = "delete"
search = "walk.all"
path = "~/.cache/mozilla/firefox"
os = "linux"

[[option]]
id = "cookies"
label = "Cookies"
description = "Delete cookies"
warning = "Deleting cookies will log you out of websites."

[[option.action]]
command = "cookies"
search = "file"
path = "$$profile$$/cookies.sqlite"

[[option]]
id = "history"
label = "History"
description = "Delete browsing history, downloads and form history"
warning = "This clears history but not your bookmarks."

[[option.action]]
command = "mozilla.url_history"
search = "file"
path = "$$profile$$/places.sqlite"

[[option]]
id = "session"
label = "Session"
description = "Delete session restore data"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/sessionstore-backups"

[[option]]
id = "thumbnails"
label = "Thumbnails"
description = "Delete cached page thumbnails"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/thumbnails"

[[option]]
id = "shader_cache"
label = "Shader cache"
description = "Delete GPU shader compilation cache (regenerated by the driver)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/shader-cache"

[[option]]
id = "forms"
label = "Form geçmişi"
description = "Kaydedilmiş form girdilerini siler (şifreler ASLA silinmez)"

[[option.action]]
command = "delete"
search = "file"
path = "$$profile$$/formhistory.sqlite"

[[option]]
id = "site_data"
label = "Site verileri"
description = "DOM depolama ve IndexedDB kalıntıları (çerezler ayrı seçenek)"

[[option.action]]
command = "delete"
search = "file"
path = "$$profile$$/webappsstore.sqlite"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/storage/default"

[[option]]
id = "telemetry"
label = "Telemetri"
description = "Mozilla'ya gönderilmeyi bekleyen kullanım verileri ve sağlık raporları"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/datareporting"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$profile$$/healthreport"
