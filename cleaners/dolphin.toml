id = "dolphin"
name = "Dolphin Emulator"
description = "Wii/GameCube emulator: shader cache and logs (saves, states and ISOs are kept)"

[[running]]
type = "exe"
value = "dolphin-emu"
os = "unix"

[[running]]
type = "exe"
value = "Dolphin.exe"
os = "windows"

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/dolphin-emu"
[[var.value]]
os = "windows"
search = "glob"
value = '$LOCALAPPDATA\Dolphin Emulator\Cache'

[[var]]
name = "data"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.local/share/dolphin-emu"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Dolphin Emulator'

[[option]]
id = "shader_cache"
label = "Shader cache"
description = "Delete compiled shader caches (rebuilt while playing, may stutter once)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$/ShaderCache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$data$$/ShaderCache"

[[option]]
id = "logs"
label = "Logs and dumps"
description = "Delete log files and crash dumps older than 30 days"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$data$$/Logs"
max_age_days = 30

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$data$$/Dumps"
max_age_days = 30
