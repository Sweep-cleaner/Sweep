id = "windsurf"
name = "Windsurf"
description = "Windsurf AI editor (Codeium): workspace cache, web caches and logs (projects, settings and extensions are kept)"

[[running]]
type = "exe"
value = "windsurf"
os = "unix"

[[running]]
type = "exe"
value = "Windsurf.exe"
os = "windows"

[[running]]
type = "exe"
value = "Windsurf"
os = "macos"

[[var]]
name = "userdata"
[[var.value]]
os = "linux"
search = "literal"
value = "~/.config/Windsurf"
[[var.value]]
os = "macos"
search = "literal"
value = "~/Library/Application Support/Windsurf"
[[var.value]]
os = "windows"
search = "literal"
value = '$APPDATA\\Windsurf'

[[var]]
name = "server"
[[var.value]]
os = "unix"
search = "glob"
value = "~/.windsurf-server"

[[option]]
id = "workspace_cache"
label = "Workspace cache"
description = "Delete cached workspace storage"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/User/workspaceStorage"

[[option]]
id = "web_cache"
label = "Web caches"
description = "Delete the Chromium page, code and GPU caches"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/Code Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/GPUCache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/CachedExtensionVSIXs"

[[option]]
id = "logs"
label = "Logs"
description = "Delete editor, telemetry uploader and Remote-Server log files"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$server$$/logs"
os = "unix"
