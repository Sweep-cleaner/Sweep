id = "jetbrains"
name = "JetBrains IDE'leri"
description = "IntelliJ, PyCharm, WebStorm ve diğerleri: günlükler ve dizinler (projeler korunur)"
os = "linux"

[[var]]
name = "ide_cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/JetBrains/*"

[[var]]
name = "android_cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/Google/AndroidStudio*"

[[option]]
id = "logs"
label = "Günlükler"
description = "IDE çalışma günlükleri"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$ide_cache$$/log"

[[option]]
id = "indices"
label = "Dizin önbellekleri"
description = "Kod dizinleri; silinince ilk açılışta yeniden kurulur (büyük projelerde dakikalar sürebilir)"
warning = "Sonraki IDE açılışı yeniden dizin kurar ve yavaş olur."

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$ide_cache$$/caches"

[[option]]
id = "android_logs"
label = "Android Studio günlükleri"
description = "Android Studio çalışma günlükleri"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$android_cache$$/log"

[[option]]
id = "android_indices"
label = "Android Studio dizinleri"
description = "Android Studio kod dizinleri; ilk açılışta yeniden kurulur"
warning = "Sonraki açılış yavaş olur."

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$android_cache$$/caches"
