id = "postfix"
name = "Postfix"
description = "Mail server logs (queue and config are never touched)"
os = "linux"

[[option]]
id = "logs"
label = "Mail logs"
description = "Delete mail log files older than 30 days"
os = "linux"

[[option.action]]
command = "delete"
search = "glob"
path = "/var/log/mail.log*"
max_age_days = 30
type = "f"
os = "linux"

[[option.action]]
command = "delete"
search = "glob"
path = "/var/log/mail.err*"
max_age_days = 30
type = "f"
os = "linux"
