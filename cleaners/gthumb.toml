id = "gthumb"
name = "gThumb"
description = "gThumb image viewer: thumbnail and metadata cache (your photos are never touched)"
os = "linux"

[[running]]
type = "exe"
value = "gthumb"

[[option]]
id = "cache"
label = "Thumbnail cache"
description = "Delete gThumb's thumbnail and metadata cache (rebuilt on demand)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "~/.cache/gthumb"
