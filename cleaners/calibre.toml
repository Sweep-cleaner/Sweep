id = "calibre"
name = "Calibre"
description = "Calibre ebook manager: caches and logs (your book library is never touched)"

[[running]]
type = "exe"
value = "calibre"
os = "unix"

[[running]]
type = "exe"
value = "calibre.exe"
os = "windows"

[[var]]
name = "config"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/calibre"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Preferences/calibre"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\calibre'

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/calibre"
[[var.value]]
os = "windows"
search = "glob"
value = '$LOCALAPPDATA\calibre-cache'

[[option]]
id = "cache"
label = "Cache"
description = "Delete cached book covers, converted formats and fetched metadata"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/caches"

[[option]]
id = "logs"
label = "Logs"
description = "Delete Calibre log files"

[[option.action]]
command = "delete"
search = "glob"
path = "$$config$$/*.log*"
type = "f"
