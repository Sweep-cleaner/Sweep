id = "anki"
name = "Anki"
description = "Anki flashcards: webview cache and collection log files (decks and media are kept)"

[[running]]
type = "exe"
value = "anki"
os = "unix"

[[running]]
type = "exe"
value = "anki.exe"
os = "windows"

[[var]]
name = "data"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.local/share/Anki2"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Anki2"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Anki2'

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/Anki"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Caches/Anki"

[[option]]
id = "cache"
label = "Cache"
description = "Delete Anki's webview and Qt cache (rebuilt on the next start)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$"

[[option]]
id = "logs"
label = "Logs"
description = "Delete per-profile collection log files; your decks and review history are not affected"

[[option.action]]
command = "delete"
search = "glob"
path = "$$data$$/*/collection.log"
type = "f"
