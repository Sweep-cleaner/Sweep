id = "vscode"
name = "Visual Studio Code"
description = "VS Code editor: workspace cache, logs and extension data"

[[running]]
type = "exe"
value = "code"
os = "unix"

[[running]]
type = "exe"
value = "Code.exe"
os = "windows"

[[var]]
name = "userdata"
[[var.value]]
os = "unix"
search = "glob"
value = "~/.config/Code/User"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Code\User'
[[var.value]]
os = "windows"
search = "glob"
value = '$LOCALAPPDATA\Code\User'

[[var]]
name = "workspace"
[[var.value]]
os = "unix"
search = "glob"
value = "~/.config/Code/User/workspaceStorage"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Code\User\workspaceStorage'

[[var]]
name = "server"
[[var.value]]
os = "unix"
search = "glob"
value = "~/.vscode-server/data"

[[option]]
id = "workspace_cache"
label = "Workspace cache"
description = "Delete cached workspace storage"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$workspace$$"

[[option]]
id = "logs"
label = "Logs"
description = "Delete VS Code log files"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/logs"

[[option]]
id = "gpu_cache"
label = "GPU cache"
description = "Delete the GPU and shader caches"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/GPUCache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/CachedData"

[[option]]
id = "remote_server"
label = "Remote server data"
description = "Delete VS Code Remote-SSH/container server logs and cached data (extensions and server binaries are kept)"
os = "unix"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$server$$/logs"
os = "unix"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$server$$/CachedData"
os = "unix"
