id = "zathura"
name = "zathura"
description = "zathura PDF viewer: cache data (your documents and reading position are kept)"
os = "linux"

[[running]]
type = "exe"
value = "zathura"

[[option]]
id = "cache"
label = "Cache"
description = "Delete zathura's rendering cache (rebuilt on demand)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "~/.cache/zathura"
