id = "evince"
name = "Evince"
description = "Evince document viewer: page and thumbnail cache (your documents are never touched)"
os = "linux"

[[running]]
type = "exe"
value = "evince"

[[option]]
id = "cache"
label = "Cache"
description = "Delete Evince's page and thumbnail cache (rebuilt on demand)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "~/.cache/evince"
