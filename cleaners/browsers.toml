[[var]]
name = "chrome_profile"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/google-chrome/*"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Google/Chrome/*"
[[var.value]]
os = "windows"
search = "glob"
value = '$LOCALAPPDATA\Google\Chrome\User Data\*'

[[var]]
name = "chromium_profile"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/chromium/*"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Chromium/*"
[[var.value]]
os = "windows"
search = "glob"
value = '$LOCALAPPDATA\Chromium\User Data\*'

[[var]]
name = "edge_profile"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/microsoft-edge/*"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Microsoft Edge/*"
[[var.value]]
os = "windows"
search = "glob"
value = '$LOCALAPPDATA\Microsoft\Edge\User Data\*'

[[var]]
name = "brave_profile"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/BraveSoftware/Brave-Browser/*"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/BraveSoftware/Brave-Browser/*"
[[var.value]]
os = "windows"
search = "glob"
value = '$LOCALAPPDATA\BraveSoftware\Brave-Browser\User Data\*'

[[var]]
name = "vivaldi_profile"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/vivaldi/*"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Vivaldi/*"
[[var.value]]
os = "windows"
search = "glob"
value = '$LOCALAPPDATA\Vivaldi\User Data\*'

[[var]]
name = "opera_profile"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/opera/*"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/com.operasoftware.Opera/*"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Opera Software\Opera Stable\*'

[[var]]
name = "opera_gx_profile"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Opera Software\Opera GX Stable\*'

# ---- Chrome ----
[[option]]
id = "chrome_cache"
label = "Chrome cache"
description = "Delete the Chrome cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$chrome_profile$$/Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$chrome_profile$$/Code Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$chrome_profile$$/GPUCache"

[[option]]
id = "chrome_history"
label = "Chrome history"
description = "Delete browsing history, downloads and favicons"
warning = "This clears your browsing history but not your bookmarks."

[[option.action]]
command = "chrome.history"
search = "file"
path = "$$chrome_profile$$/History"

[[option.action]]
command = "chrome.favicons"
search = "file"
path = "$$chrome_profile$$/Favicons"

[[option]]
id = "chrome_cookies"
label = "Chrome cookies"
description = "Delete cookies"

[[option.action]]
command = "chrome.cookies"
search = "file"
path = "$$chrome_profile$$/Cookies"

