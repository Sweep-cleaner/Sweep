id = "browsers"
name = "Chromium-based browsers"
description = "Chrome, Chromium, Edge, Brave, Vivaldi and Opera: cache, code cache, cookies and history"

# Çalışan tarayıcı profili temizlenmez (worker --force olmadan atlar).
# Linux dağıtımları farklı ikili adları kullanır; hepsi listelenir.
[[running]]
type = "exe"
value = "chrome"
os = "unix"

[[running]]
type = "exe"
value = "google-chrome"
os = "unix"

[[running]]
