id = "whatsapp"
name = "WhatsApp"
description = "WhatsApp Desktop cache and logs (chats and login are kept)"

[[running]]
type = "exe"
value = "WhatsApp"
os = "unix"

[[running]]
type = "exe"
value = "WhatsApp.exe"
os = "windows"

[[running]]
type = "exe"
value = "WhatsApp"
os = "macos"

[[var]]
name = "config"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/WhatsApp"
[[var.value]]
os = "windows"
search = "glob"
value = "$LOCALAPPDATA\\WhatsApp"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/WhatsApp"

[[option]]
id = "cache"
label = "Cache"
description = "Delete the client, GPU and code caches"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Code Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/GPUCache"

[[option]]
id = "logs"
label = "Logs"
description = "Delete log files and crash dumps"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Crashpad"
