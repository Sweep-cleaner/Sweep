id = "rstudio"
name = "RStudio"
description = "RStudio: session cache and logs (projects and scripts are kept)"

[[running]]
type = "exe"
value = "rstudio"

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/rstudio"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Caches/RStudio"
[[var.value]]
os = "windows"
search = "glob"
value = '$LOCALAPPDATA\RStudio'

[[var]]
name = "state"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.local/share/rstudio"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/RStudio"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\RStudio'

[[option]]
id = "cache"
label = "Cache"
description = "Delete RStudio's cache and session data (rebuilt on the next start)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$"

[[option]]
id = "logs"
label = "Logs"
description = "Delete RStudio log files"

[[option.action]]
command = "delete"
search = "glob"
path = "$$state$$/**/*.log*"
type = "f"
