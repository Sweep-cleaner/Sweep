id = "toolbx"
name = "Toolbx"
description = "Toolbx container cache (containers themselves are kept)"
os = "linux"

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/toolbx"

[[option]]
id = "cache"
label = "Container cache"
description = "Delete the Toolbx cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$"
os = "linux"
