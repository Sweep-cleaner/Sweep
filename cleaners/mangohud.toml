id = "mangohud"
name = "MangoHud"
description = "MangoHud overlay cache (config and presets are kept)"
os = "linux"

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/MangoHud"

[[option]]
id = "cache"
label = "Overlay cache"
description = "Delete the MangoHud cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$"
os = "linux"
