id = "gamemode"
name = "GameMode"
description = "GameMode daemon cache (config in /etc and ~ stays untouched)"
os = "linux"

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.cache/gamemode"

[[option]]
id = "cache"
label = "Daemon cache"
description = "Delete the GameMode cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$"
os = "linux"
