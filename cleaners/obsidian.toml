id = "obsidian"
name = "Obsidian"
description = "Note-taking app: cache and logs only (vaults, plugins and settings are kept)"

[[running]]
type = "exe"
value = "obsidian"
os = "unix"

[[running]]
type = "exe"
value = "Obsidian.exe"
os = "windows"

[[running]]
type = "exe"
value = "Obsidian"
os = "macos"

[[var]]
name = "config"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/obsidian"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/obsidian"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\obsidian'

[[option]]
id = "cache"
label = "Cache"
description = "Delete the renderer, GPU and code caches"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Code Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/GPUCache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/ShaderCache"

[[option]]
id = "logs"
label = "Logs"
description = "Delete log files and crash dumps"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Crashpad"
