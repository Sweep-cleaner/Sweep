id = "mattermost"
name = "Mattermost"
description = "Mattermost client: cache, logs and crash dumps (login and team data are kept)"

[[running]]
type = "exe"
value = "mattermost-desktop"
os = "unix"

[[running]]
type = "exe"
value = "Mattermost.exe"
os = "windows"

[[running]]
type = "exe"
value = "Mattermost"
os = "macos"

[[var]]
name = "config"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/Mattermost"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Mattermost"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Mattermost'

[[option]]
id = "cache"
label = "Cache"
description = "Delete the client, GPU and code caches"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Code Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/GPUCache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/ShaderCache"

[[option]]
id = "logs"
label = "Logs"
description = "Delete log files and crash dumps"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Crashpad"
