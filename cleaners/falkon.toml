id = "falkon"
name = "Falkon"
description = "KDE browser cache (bookmarks and settings are kept)"
os = "linux"

[[running]]
type = "exe"
value = "falkon"
os = "unix"

[[var]]
name = "cache"
[[var.value]]
value = "~/.cache/falkon"
search = "literal"
os = "linux"

[[option]]
id = "cache"
label = "Cache"
description = "Delete the browsing cache"
os = "linux"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$"
os = "linux"
