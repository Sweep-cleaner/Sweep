id = "figma"
name = "Figma"
description = "Figma desktop app: web caches, shader caches and logs (local documents sync from the cloud and are kept)"

[[running]]
type = "exe"
value = "figma-linux"
os = "unix"

[[running]]
type = "exe"
value = "Figma.exe"
os = "windows"

[[running]]
type = "exe"
value = "Figma"
os = "macos"

[[var]]
name = "userdata"
[[var.value]]
os = "linux"
search = "literal"
value = "~/.config/Figma"
[[var.value]]
os = "macos"
search = "literal"
value = "~/Library/Application Support/Figma"
[[var.value]]
os = "windows"
search = "literal"
value = '$APPDATA\\Figma'

[[option]]
id = "web_cache"
label = "Web caches"
description = "Delete the Chromium page, code and GPU caches"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/Code Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/GPUCache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/DawnCache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/ShaderCache"

[[option]]
id = "logs"
label = "Logs"
description = "Delete client logs and crash reports"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$userdata$$/Crashpad"
