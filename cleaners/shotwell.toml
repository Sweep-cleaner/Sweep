id = "shotwell"
name = "Shotwell"
description = "Shotwell photo manager: thumbnail and staging cache (your photos are never touched)"
os = "linux"

[[running]]
type = "exe"
value = "shotwell"

[[option]]
id = "cache"
label = "Cache"
description = "Delete Shotwell's thumbnail and staging cache (rebuilt on demand)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "~/.cache/shotwell"
