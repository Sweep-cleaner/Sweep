id = "postman"
name = "Postman"
description = "API client: cache and logs (collections and environments are kept)"

[[running]]
type = "exe"
value = "postman"
os = "unix"

[[running]]
type = "exe"
value = "Postman.exe"
os = "windows"

[[running]]
type = "exe"
value = "Postman"
os = "macos"

[[var]]
name = "config"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/Postman"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Postman"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Postman'

[[option]]
id = "cache"
label = "Cache"
description = "Delete the client, GPU and code caches"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Code Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/GPUCache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/ShaderCache"

[[option]]
id = "logs"
label = "Logs"
description = "Delete log files and crash dumps"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Crashpad"
