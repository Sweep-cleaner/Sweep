id = "element"
name = "Element"
description = "Element Matrix client: cache, logs and crash dumps (login and room data are kept)"

[[running]]
type = "exe"
value = "element-desktop"
os = "unix"

[[running]]
type = "exe"
value = "Element.exe"
os = "windows"

[[running]]
type = "exe"
value = "Element"
os = "macos"

[[var]]
name = "config"
[[var.value]]
os = "linux"
search = "glob"
value = "~/.config/Element"
[[var.value]]
os = "macos"
search = "glob"
value = "~/Library/Application Support/Element"
[[var.value]]
os = "windows"
search = "glob"
value = '$APPDATA\Element'

[[option]]
id = "cache"
label = "Cache"
description = "Delete the client, GPU and code caches"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Code Cache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/GPUCache"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/ShaderCache"

[[option]]
id = "logs"
label = "Logs"
description = "Delete log files and crash dumps"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/logs"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$config$$/Crashpad"
