id = "zed"
name = "Zed"
description = "Zed editor: logs and caches (settings, extensions and workspace state are kept)"

[[running]]
type = "exe"
value = "zed"
os = "unix"

[[running]]
type = "exe"
value = "Zed.exe"
os = "windows"

[[running]]
type = "exe"
value = "Zed"
os = "macos"

[[var]]
name = "data"
[[var.value]]
os = "linux"
search = "literal"
value = "~/.local/share/zed"
[[var.value]]
os = "macos"
search = "literal"
value = "~/Library/Application Support/Zed"
[[var.value]]
os = "windows"
search = "literal"
value = '$APPDATA\Zed'

[[var]]
name = "cache"
[[var.value]]
os = "linux"
search = "literal"
value = "~/.cache/zed"
[[var.value]]
os = "macos"
search = "literal"
value = "~/Library/Caches/Zed"
[[var.value]]
os = "windows"
search = "literal"
value = '$LOCALAPPDATA\Zed\cache'

[[option]]
id = "logs"
label = "Logs"
description = "Delete editor log files (settings and extensions are kept)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$data$$/logs"

[[option]]
id = "cache"
label = "Cache"
description = "Delete downloaded caches (extensions are kept)"

[[option.action]]
command = "delete"
search = "walk.all"
path = "$$cache$$"
